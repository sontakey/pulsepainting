name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    # Includes Chromium/WebKit worker parity and recovery across all 16 scenes.
    timeout-minutes: 20
    container:
      # Match the pinned Playwright package; avoid apt mirror availability at test time.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1
        timeout-minutes: 3
      - run: npm test
      - name: Preserve pulse rendering failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pulse-rendering-failure
          # Only public-fixture screenshots and test results, never local env files.
          path: |
            .dream-loop/crisp-brush/verification/*.json
            .dream-loop/crisp-brush/verification/*settled*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
